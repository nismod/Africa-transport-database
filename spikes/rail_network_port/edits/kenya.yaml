# Derived from kenya.sql in trg-rail/africa_rail_network, adapted with the
# author's permission.
#
# Transcribed by parse_country_sql.py from 816 lines of SQL: 41 edits,
# 14 statements skipped as unable to reach the published network
# (2 recomputed length, 1 routing test, 11 schema),
# and 14 not transcribed - see the report.
#
# Order matters. Splitting an edge replaces it with two new ones, so an id used
# further down may be one an earlier edit created.

